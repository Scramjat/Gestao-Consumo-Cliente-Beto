<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comanda · Controle de consumo</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">

  <!-- App instalável (tablet/celular): ícone, cores e tela cheia -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="theme-color" content="#e8590c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Comanda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/index.css">
  <link rel="stylesheet" href="assets/css/metrics.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- Carregado no <head> para aplicar o tema antes da página aparecer (evita "piscar") -->
  <script src="assets/js/theme.js"></script>
</head>
<body>

  <!-- ===== Barra superior ===== -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M4 8h13v9a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z"/><path d="M7 2v2M11 2v2M15 2v2"/></svg>
        </div>
        <div>
          <h1 class="brand__title">Comanda</h1>
          <p class="brand__night" id="todayLabel"></p>
        </div>
      </div>

      <nav class="topbar__actions" aria-label="Ações">
        <button class="icon-btn" id="btnMetrics" data-tip="Métricas" aria-label="Abrir métricas">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16v-3M12 16V8M17 16v-6"/></svg>
        </button>

        <!-- Baixar: planilha, backup e restauração -->
        <div class="menu-wrap">
          <button class="icon-btn" id="btnExport" data-tip="Planilha e backup" aria-label="Planilha e backup" aria-haspopup="menu" aria-expanded="false">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          </button>
          <div class="menu" id="exportMenu" role="menu" hidden>
            <button class="menu__item" role="menuitem" data-menu="excel">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
              <span><strong>Planilha Excel</strong><small>Tudo de cada cliente</small></span>
            </button>
            <button class="menu__item" role="menuitem" data-menu="backup">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
              <span><strong>Fazer backup</strong><small id="lastBackupLabel">Nunca feito</small></span>
            </button>
            <button class="menu__item" role="menuitem" data-menu="restore">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg>
              <span><strong>Restaurar backup</strong><small>Recuperar de um arquivo</small></span>
            </button>
          </div>
          <input type="file" id="restoreInput" accept=".json,application/json" hidden>
        </div>

        <button class="icon-btn theme-toggle" id="btnTheme" data-tip="Alternar tema" aria-label="Alternar tema claro/escuro">
          <svg class="icon i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </nav>
    </div>
    <!-- Aviso quando o banco (Obsidian) não está conectado -->
    <div class="db-banner" id="dbBanner" role="alert" hidden>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span id="dbBannerText"></span>
    </div>
  </header>

  <main class="container">

    <!-- ===== Resumo ===== -->
    <!-- Cada card abre o que ele representa: filtra a lista ou mostra os itens -->
    <section class="stats" id="statsGroup" aria-label="Resumo">
      <button class="stat is-active" data-filter="all">
        <span class="stat__label">Na casa</span>
        <strong class="stat__value" id="statClients">0</strong>
        <span class="stat__hint">Ver clientes com conta aberta</span>
      </button>
      <button class="stat" data-open="items">
        <span class="stat__label">Itens pedidos</span>
        <strong class="stat__value" id="statItems">0</strong>
        <span class="stat__hint">Ver todos os itens</span>
      </button>
      <button class="stat" data-filter="consuming">
        <span class="stat__label">Com consumo</span>
        <strong class="stat__value" id="statConsuming">0</strong>
        <span class="stat__hint">Ver quem já pediu</span>
      </button>
      <button class="stat" data-filter="idle">
        <span class="stat__label">Sem consumo</span>
        <strong class="stat__value" id="statIdle">0</strong>
        <span class="stat__hint">Ver quem ainda não pediu</span>
      </button>
      <button class="stat stat--done" data-filter="closed">
        <span class="stat__label">Concluídos</span>
        <strong class="stat__value" id="statClosed">0</strong>
        <span class="stat__hint">Ver contas encerradas</span>
      </button>
    </section>

    <!-- ===== Busca, filtros e botão principal ===== -->
    <section class="toolbar">
      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Buscar por nome, mesa ou CPF" autocomplete="off" aria-label="Buscar cliente">
        <kbd>/</kbd>
      </label>

      <div class="segmented" id="filterGroup" role="group" aria-label="Filtrar clientes">
        <span class="segmented__thumb" aria-hidden="true"></span>
        <button class="segmented__btn is-active" data-filter="all">Todos <span class="segmented__count" id="countAll">0</span></button>
        <button class="segmented__btn" data-filter="consuming">Com consumo <span class="segmented__count" id="countConsuming">0</span></button>
        <button class="segmented__btn" data-filter="idle">Sem consumo <span class="segmented__count" id="countIdle">0</span></button>
        <button class="segmented__btn segmented__btn--done" data-filter="closed">Concluídos <span class="segmented__count" id="countClosed">0</span></button>
      </div>

      <button class="btn btn--primary btn--lg" id="btnAddClient">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Novo cliente
        <kbd>N</kbd>
      </button>
    </section>

    <!-- ===== Lista de clientes ===== -->
    <section class="client-grid" id="clientList" aria-live="polite"></section>

    <div class="empty" id="emptyState" hidden>
      <div class="empty__art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M4 8h13v9a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4Z"/><path d="M7 2v2M11 2v2M15 2v2"/></svg>
      </div>
      <h2>Nenhum cliente ainda</h2>
      <p>Cadastre o primeiro cliente para começar a anotar o consumo.</p>
      <button class="btn btn--primary" id="btnEmptyAdd">Cadastrar primeiro cliente</button>
    </div>

    <div class="empty empty--compact" id="noResults" hidden>
      <h2 id="noResultsTitle">Nada encontrado</h2>
      <p id="noResultsText">Nenhum cliente corresponde à busca ou ao filtro.</p>
    </div>
  </main>

  <!-- Botão flutuante (celular) -->
  <button class="fab" id="fabAdd" aria-label="Novo cliente">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- ===== Modal: cadastro / edição de cliente ===== -->
  <dialog class="modal" id="clientDialog" aria-labelledby="clientDialogTitle">
    <form class="modal__card" id="clientForm" novalidate>
      <header class="modal__head">
        <h2 id="clientDialogTitle">Novo cliente</h2>
        <button type="button" class="icon-btn icon-btn--sm" data-close aria-label="Fechar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <label class="field">
          <span class="field__label">Nome <em>*</em></span>
          <input id="clientName" name="name" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: Gabriel">
          <small class="field__error" id="nameError"></small>
        </label>

        <label class="field">
          <span class="field__label">Número da mesa <span class="field__hint">(opcional)</span></span>
          <input id="clientTable" name="table" type="text" maxlength="10" autocomplete="off" placeholder="Ex.: 5">
        </label>

        <label class="field">
          <span class="field__label">CPF <span class="field__hint">(opcional)</span></span>
          <input id="clientCpf" name="cpf" type="text" inputmode="numeric" maxlength="14" autocomplete="off" placeholder="000.000.000-00">
          <small class="field__error" id="cpfError"></small>
        </label>
      </div>

      <footer class="modal__foot">
        <button type="button" class="btn btn--ghost" data-close>Cancelar</button>
        <button type="submit" class="btn btn--primary">Salvar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Modal: adicionar consumo ===== -->
  <dialog class="modal" id="itemDialog" aria-labelledby="itemDialogTitle">
    <form class="modal__card" id="itemForm" novalidate>
      <header class="modal__head">
        <div>
          <h2 id="itemDialogTitle">Adicionar consumo</h2>
          <p class="modal__sub" id="itemDialogClient"></p>
        </div>
        <button type="button" class="icon-btn icon-btn--sm" data-close aria-label="Fechar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>

      <div class="modal__body">
        <label class="field">
          <span class="field__label">O que pediu?</span>
          <input id="itemProduct" type="text" maxlength="60" autocomplete="off" placeholder="Ex.: cerveja skol">
          <small class="field__error" id="productError"></small>
        </label>

        <div class="field">
          <span class="field__label">Quantidade</span>
          <div class="stepper">
            <button type="button" class="stepper__btn" data-step="-1" aria-label="Menos">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <input id="itemQty" type="number" min="1" max="999" value="1" inputmode="numeric" aria-label="Quantidade">
            <button type="button" class="stepper__btn" data-step="1" aria-label="Mais">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>

        <div class="already" id="itemCurrent" hidden></div>
      </div>

      <footer class="modal__foot">
        <button type="button" class="btn btn--ghost" id="btnItemAnother">Adicionar e continuar</button>
        <button type="submit" class="btn btn--primary">Adicionar</button>
      </footer>
    </form>
  </dialog>

  <!-- ===== Modal: todos os itens pedidos ===== -->
  <dialog class="modal modal--lg" id="itemsDialog" aria-labelledby="itemsDialogTitle">
    <div class="modal__card">
      <header class="modal__head">
        <div>
          <h2 id="itemsDialogTitle">Itens pedidos</h2>
          <p class="modal__sub" id="itemsDialogSub"></p>
        </div>
        <button type="button" class="icon-btn icon-btn--sm" data-close aria-label="Fechar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal__body">
        <div class="segmented segmented--small" id="itemsView" role="group" aria-label="Agrupar itens">
          <span class="segmented__thumb" aria-hidden="true"></span>
          <button class="segmented__btn is-active" data-view="product">Por produto</button>
          <button class="segmented__btn" data-view="time">Por horário</button>
        </div>
        <div class="items-report" id="itemsReport"></div>
      </div>
    </div>
  </dialog>

  <!-- ===== Modal: métricas ===== -->
  <dialog class="modal modal--xl" id="metricsDialog" aria-labelledby="metricsTitle">
    <div class="modal__card">
      <header class="modal__head">
        <div>
          <h2 id="metricsTitle">Métricas</h2>
          <p class="modal__sub" id="metricsSub"></p>
        </div>
        <button type="button" class="icon-btn icon-btn--sm" data-close aria-label="Fechar">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="modal__body mx" id="metricsBody">
        <div class="mx-period" id="metricsPeriod" role="group" aria-label="Período">
          <button class="mx-period__btn is-active" data-period="today">Hoje</button>
          <button class="mx-period__btn" data-period="24h">24 horas</button>
          <button class="mx-period__btn" data-period="7d">7 dias</button>
          <button class="mx-period__btn" data-period="30d">30 dias</button>
          <button class="mx-period__btn" data-period="all">Tudo</button>
        </div>
        <div id="metricsContent"></div>
      </div>
      <div class="mx-tooltip" id="metricsTooltip" role="tooltip" hidden></div>
    </div>
  </dialog>

  <!-- ===== Modal: confirmação ===== -->
  <dialog class="modal modal--sm" id="confirmDialog" aria-labelledby="confirmTitle">
    <div class="modal__card">
      <div class="modal__body confirm">
        <div class="confirm__icon" id="confirmIcon" aria-hidden="true"></div>
        <h2 id="confirmTitle"></h2>
        <p id="confirmMessage"></p>
      </div>
      <footer class="modal__foot">
        <button type="button" class="btn btn--ghost" data-value="cancel">Cancelar</button>
        <button type="button" class="btn btn--danger" data-value="ok" id="confirmOk">Confirmar</button>
      </footer>
    </div>
  </dialog>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <!-- ===== Scripts (ordem importa) ===== -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/excel.js"></script>
  <script src="assets/js/metrics.js"></script>
  <script src="assets/js/obsidian.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
