# Render: publica o sistema na internet.
# No Render: New + → Blueprint → escolha este repositório. O Render lê este arquivo.
#
# Segredos NÃO ficam no código (o repositório é público): o Render pergunta
# o DATABASE_URL, ou você cola em Dashboard → o serviço → Environment.
#   DATABASE_URL    endereço do banco Postgres (Neon). Sem ele o sistema ainda sobe,
#                   mas guarda os dados em arquivo e eles somem quando o servidor reinicia.
#   SESSION_SECRET  assina as sessões (gerado sozinho)
#   ENCRYPTION_KEY  cifra as senhas guardadas no banco, para o painel poder mostrá-las (gerado sozinho)
#   SENHA_INICIAL   (opcional) senha das 3 contas na primeira vez; sem ela é "beto"

services:
  - type: web
    name: gestao-consumo-cliente-beto
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NODE_VERSION
        value: 22
