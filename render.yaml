# Render: publica o sistema na internet.
# No Render: New + → Blueprint → escolha este repositório. O Render lê este arquivo.
#
# Segredos NÃO ficam no código (o repositório é público): o Render pergunta
# os marcados com "sync: false", ou você cola em Dashboard → o serviço → Environment.
#   DATABASE_URL      (obrigatória) endereço do banco Postgres (Neon)
#   SESSION_SECRET    assina as sessões (gerado sozinho)
#   PLATAFORMA_SENHA  senha do painel do dono (/plataforma), 12 caracteres ou mais
#   PLATAFORMA_LOGIN  (opcional) login do painel; sem ele é "dono"

services:
  - type: web
    name: gestao-consumo-cliente-beto
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATAFORMA_SENHA
        sync: false
      - key: NODE_VERSION
        value: 22
